name: Recover verified v1 Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed tag workflow run whose signed release candidate was assembled successfully
        required: true
        type: string
      release_tag:
        description: Existing v1.0.x tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: audux-release
  cancel-in-progress: false

jobs:
  recover-release:
    name: Verify candidate and recover GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - name: Validate source run, tag, and candidate artifact
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          candidate_name="audux-release-candidate-${version}"

          [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${RELEASE_TAG}" == v1.0.* ]]
          test "${RELEASE_TAG}" = "v${version}"

          git fetch --no-tags origin main
          tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          git merge-base --is-ancestor "${tag_sha}" origin/main

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.event' <<< "${run_json}")" = "push"
          test "$(jq -r '.path' <<< "${run_json}")" = ".github/workflows/release.yml"
          test "$(jq -r '.head_branch' <<< "${run_json}")" = "${RELEASE_TAG}"
          test "$(jq -r '.head_sha' <<< "${run_json}")" = "${tag_sha}"
          test "$(jq -r '.status' <<< "${run_json}")" = "completed"

          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"
          candidate_count="$(
            jq --arg name "${candidate_name}" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<< "${artifacts_json}"
          )"
          test "${candidate_count}" = "1"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "candidate_name=${candidate_name}" >> "${GITHUB_OUTPUT}"
          echo "notes_path=docs/releases/${RELEASE_TAG}.md" >> "${GITHUB_OUTPUT}"
      - name: Download signed release candidate from source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ steps.context.outputs.candidate_name }}
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Verify signed candidate assets before draft
        run: python backend/release_artifacts.py verify --input release-assets
      - name: Create draft release and upload exact assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.context.outputs.tag }}
          body_path: ${{ steps.context.outputs.notes_path }}
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/*
      - name: Download draft assets and verify checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          gh release download "${RELEASE_TAG}" --dir "${verify_dir}"
          python backend/release_artifacts.py verify --input "${verify_dir}"
      - name: Publish verified draft as latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest
