name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate ${{ matrix.platform }} baselines
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
            snapshot_platform: win32
          - platform: macos
            os: macos-15
            snapshot_platform: darwin

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Generate visual baselines
        run: npm run test:visual:update

      - name: Verify generated baselines
        run: npm run test:visual

      - name: Upload platform baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: visual-baselines-${{ matrix.platform }}
          path: frontend/tests/visual/__screenshots__/**/*-chromium-${{ matrix.snapshot_platform }}.png
          if-no-files-found: error
          retention-days: 7
