name: Internal Builds and v1 Release

on:
  workflow_dispatch:
    inputs:
      signed_preflight:
        description: Build and sign a release candidate from main without publishing or manual approval
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v1.*.*"

permissions:
  contents: read

concurrency:
  group: audux-release
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Release quality gates
    uses: ./.github/workflows/quality-gates.yml

  release-context:
    name: Validate release context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.context.outputs.mode }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - name: Fetch main for release ancestry validation
        if: github.event_name == 'push'
        run: git fetch --no-tags origin main
      - name: Validate version, ref, main ancestry, and release notes
        id: context
        env:
          AUDUX_SIGNED_PREFLIGHT: ${{ inputs.signed_preflight }}
        run: >-
          python3 backend/validate_release_context.py
          --repository-root "${GITHUB_WORKSPACE}"
          --event-name "${GITHUB_EVENT_NAME}"
          --ref "${GITHUB_REF}"
          --ref-name "${GITHUB_REF_NAME}"
          --sha "${GITHUB_SHA}"
          --signed-preflight "${AUDUX_SIGNED_PREFLIGHT}"
          --main-ref origin/main
          --github-output "${GITHUB_OUTPUT}"

  build-tauri:
    name: Build ${{ needs.release-context.outputs.mode }} artifacts on ${{ matrix.name }}
    needs: [quality-gates, release-context]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # This environment scopes signing secrets and allowed refs. It intentionally
    # has no required reviewer because Audux is maintained by one person.
    environment:
      name: ${{ needs.release-context.outputs.mode == 'signed' && 'release' || 'internal-build' }}
    env:
      AUDUX_WHISPER_MANIFEST_PUBLIC_KEY: ${{ secrets.AUDUX_WHISPER_MANIFEST_PUBLIC_KEY }}
      AUDUX_REQUIRE_WHISPER_MANIFEST_SIGNATURE: ${{ needs.release-context.outputs.mode == 'signed' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-2025
          - name: macos-arm64
            os: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install backend build dependencies
        run: uv sync --locked --group build
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.3.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build browser-lite frontend
        working-directory: frontend
        run: npm run build:browser-lite
      - name: Build browser-lite executable
        run: uv run --locked --group build python backend/build_browser_lite.py
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          workspaces: frontend/src-tauri -> target
      - name: Build unsigned Tauri app
        if: needs.release-context.outputs.mode == 'unsigned'
        working-directory: frontend
        run: npm run tauri:build
      - name: Prepare signed updater configuration
        if: needs.release-context.outputs.mode == 'signed'
        working-directory: frontend
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/prepare-updater-config.mjs
      - name: Build Tauri app with signed updater artifacts
        if: needs.release-context.outputs.mode == 'signed' && runner.os != 'macOS'
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --config src-tauri/tauri.release.conf.json
      - name: Build macOS app with signed updater artifacts
        if: needs.release-context.outputs.mode == 'signed' && runner.os == 'macOS'
        working-directory: frontend
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Tauri's DMG bundler can fail transiently on hosted macOS runners. Keep
        # verbose output for diagnosis and retry only the affected platform.
        run: |
          set -euo pipefail
          max_attempts=3

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if npm run tauri:build -- --verbose --config src-tauri/tauri.release.conf.json; then
              exit 0
            fi

            if ((attempt == max_attempts)); then
              echo "::error::macOS Tauri build failed after ${max_attempts} attempts"
              exit 1
            fi

            retry_delay=$((attempt * 5))
            echo "::warning::macOS Tauri build attempt ${attempt} failed; retrying in ${retry_delay}s"
            sleep "${retry_delay}"
          done
      - name: Normalize updater artifact names
        if: needs.release-context.outputs.mode == 'signed'
        working-directory: frontend
        shell: bash
        run: >-
          node scripts/normalize-updater-artifacts.mjs
          "${{ matrix.name }}"
          "${{ needs.release-context.outputs.version }}"
      - name: Install Whisper companion dependencies
        run: uv sync --locked --extra asr --group build
      - name: Build Whisper companion
        run: uv run --locked --extra asr --group build python backend/build_whisper_companion.py
      - name: Validate and stage platform artifacts
        run: >-
          uv run --locked python backend/release_artifacts.py stage
          --platform "${{ matrix.name }}"
          --mode "${{ needs.release-context.outputs.mode }}"
          --output release-stage
      - name: Upload validated platform artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: audux-${{ matrix.name }}
          path: release-stage/*
          if-no-files-found: error
          retention-days: 14

  assemble-release-candidate:
    name: Assemble and attest signed release candidate
    needs: [release-context, build-tauri]
    if: needs.release-context.outputs.mode == 'signed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Download validated platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: audux-*
          path: release-artifacts
          merge-multiple: false
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install manifest signing dependencies
        run: uv sync --locked
      - name: Build Whisper component manifest
        run: >-
          uv run --locked python backend/build_whisper_manifest.py
          --input release-artifacts
          --output release-metadata/whisper-components.json
          --version "${{ needs.release-context.outputs.version }}"
      - name: Sign and verify Whisper component manifest
        env:
          AUDUX_WHISPER_MANIFEST_PRIVATE_KEY: ${{ secrets.AUDUX_WHISPER_MANIFEST_PRIVATE_KEY }}
          AUDUX_WHISPER_MANIFEST_PUBLIC_KEY: ${{ secrets.AUDUX_WHISPER_MANIFEST_PUBLIC_KEY }}
        run: >-
          uv run --locked python backend/sign_whisper_manifest.py
          release-metadata/whisper-components.json
      - name: Build application update manifest
        run: >-
          uv run --locked python backend/build_update_manifest.py
          --input release-artifacts
          --output release-metadata/latest.json
          --version "${{ needs.release-context.outputs.version }}"
          --repository "${GITHUB_REPOSITORY}"
          --tag "v${{ needs.release-context.outputs.version }}"
          --notes "Audux ${{ needs.release-context.outputs.version }} application update"
      - name: Assemble exact public asset set and checksums
        run: >-
          uv run --locked python backend/release_artifacts.py assemble
          --input release-artifacts
          --metadata release-metadata
          --output release-assets
          --version "${{ needs.release-context.outputs.version }}"
      - name: Generate build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Upload signed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: audux-release-candidate-${{ needs.release-context.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish verified GitHub Release
    needs: [release-context, assemble-release-candidate]
    if: github.event_name == 'push' && needs.release-context.outputs.mode == 'signed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Validate release notes
        id: release-notes
        shell: bash
        run: |
          english_notes_path="docs/en/releases/${GITHUB_REF_NAME}.md"
          chinese_notes_path="docs/zh-CN/releases/${GITHUB_REF_NAME}.md"
          test -f "${english_notes_path}"
          test -f "${chinese_notes_path}"
          echo "path=${english_notes_path}" >> "${GITHUB_OUTPUT}"
      - name: Download signed release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: audux-release-candidate-${{ needs.release-context.outputs.version }}
          path: release-assets
      - name: Create draft release and upload exact assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.release-notes.outputs.path }}
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/*
      - name: Download draft assets and verify checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" --dir "${verify_dir}"
          python backend/release_artifacts.py verify --input "${verify_dir}"
      - name: Publish verified draft as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
