name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    name: Build Tauri on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: windows-x64
            os: windows-latest
          - name: macos-x64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --group build

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build browser-lite frontend
        working-directory: frontend
        run: npm run build:browser-lite

      - name: Build browser-lite executable
        run: uv run --locked --group build python backend/build_browser_lite.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Build Tauri app
        working-directory: frontend
        run: npm run tauri:build

      - name: Install Whisper companion dependencies
        run: uv sync --locked --extra asr --group build

      - name: Build Whisper companion
        run: uv run --locked --extra asr --group build python backend/build_whisper_companion.py

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: local-audio-library-${{ matrix.name }}
          path: |
            frontend/src-tauri/target/release/bundle/**
            backend/dist/browser-lite/**
            backend/dist/whisper-components/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-tauri
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundle artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: local-audio-library-*
          path: release-artifacts
          merge-multiple: false

      - name: Build Whisper component manifest
        shell: bash
        run: |
          python backend/build_whisper_manifest.py \
            --input release-artifacts \
            --output release-artifacts/whisper-components.json \
            --version "${GITHUB_REF_NAME#v}"

      - name: List release files
        shell: bash
        run: |
          find release-artifacts -maxdepth 10 -type f -print

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/**/bundle/**/*
            release-artifacts/**/local-audio-library-lite-*.zip
            release-artifacts/**/local-audio-whisper-*.zip
            release-artifacts/whisper-components.json
