name: Internal Builds and v1 Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.0.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    name: Build Tauri on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: windows-x64
            os: windows-latest
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate public release tag matches application version
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          application_version="$(tr -d '[:space:]' < VERSION)"
          test "$expected_version" = "$application_version"

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --group build

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build browser-lite frontend
        working-directory: frontend
        run: npm run build:browser-lite

      - name: Build browser-lite executable
        run: uv run --locked --group build python backend/build_browser_lite.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Build unsigned Tauri app for internal validation
        if: github.event_name == 'workflow_dispatch'
        working-directory: frontend
        run: npm run tauri:build

      - name: Prepare signed updater configuration
        if: github.event_name == 'push'
        working-directory: frontend
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/prepare-updater-config.mjs

      - name: Build Tauri app with signed updater artifacts
        if: github.event_name == 'push'
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --config src-tauri/tauri.release.conf.json

      - name: Normalize updater artifact names
        if: github.event_name == 'push'
        working-directory: frontend
        shell: bash
        run: node scripts/normalize-updater-artifacts.mjs "${{ matrix.name }}" "${GITHUB_REF_NAME#v}"

      - name: Install Whisper companion dependencies
        run: uv sync --locked --extra asr --group build

      - name: Build Whisper companion
        run: uv run --locked --extra asr --group build python backend/build_whisper_companion.py

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: audux-${{ matrix.name }}
          # Upload release inputs and distributable files only. In particular,
          # exclude the uncompressed Linux *.AppDir staging tree used to build AppImage.
          path: |
            frontend/src-tauri/target/release/bundle/**/*.AppImage
            frontend/src-tauri/target/release/bundle/**/*.deb
            frontend/src-tauri/target/release/bundle/**/*.rpm
            frontend/src-tauri/target/release/bundle/**/*.msi
            frontend/src-tauri/target/release/bundle/**/*.exe
            frontend/src-tauri/target/release/bundle/**/*.dmg
            frontend/src-tauri/target/release/bundle/**/*.sig
            frontend/src-tauri/target/release/bundle/**/*.app.tar.gz
            backend/dist/browser-lite/audux-lite-*.zip
            backend/dist/whisper-components/audux-whisper-*.zip
            backend/dist/whisper-components/whisper-component-*.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-tauri
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v1.0.')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundle artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: audux-*
          path: release-artifacts
          merge-multiple: false

      - name: Build Whisper component manifest
        shell: bash
        run: |
          python backend/build_whisper_manifest.py \
            --input release-artifacts \
            --output release-artifacts/whisper-components.json \
            --version "${GITHUB_REF_NAME#v}"

      - name: Build application update manifest
        shell: bash
        run: |
          python backend/build_update_manifest.py \
            --input release-artifacts \
            --output release-artifacts/latest.json \
            --version "${GITHUB_REF_NAME#v}" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --notes "Audux ${GITHUB_REF_NAME#v} application update"

      - name: List release files
        shell: bash
        run: |
          find release-artifacts -maxdepth 10 -type f -print

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.sig
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/audux-lite-*.zip
            release-artifacts/**/audux-whisper-*.zip
            release-artifacts/whisper-components.json
            release-artifacts/latest.json
