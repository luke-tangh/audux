[project]
name = "local-audio-library"
version = "0.5.0-beta.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "sqlmodel==0.0.39",
    "pydantic==2.13.4",
    "mutagen==1.48.1",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "numpy==2.2.6",
    "onnxruntime==1.23.2",
]

[project.optional-dependencies]
asr = [
    "faster-whisper==1.2.1",
]

[dependency-groups]
build = [
    "pyinstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 70
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.uv]
package = false
