[project]
name = "audux"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlmodel==0.0.48",
    "pydantic==2.14.2",
    "mutagen==1.48.1",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
]

[project.optional-dependencies]
asr = [
    "faster-whisper==1.2.1",
]

[dependency-groups]
build = [
    "pyinstaller==6.22.2",
    "pyinstaller-hooks-contrib==2026.9",
]
test = [
    "mypy>=2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 70
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Start with correctness rules that are safe for SQLAlchemy expressions and
# existing compatibility re-exports. Broaden this set as legacy findings are
# addressed instead of landing a repository-wide mechanical rewrite.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true

[tool.uv]
package = false
