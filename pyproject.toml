[project]
name = "local-audio-library"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "sqlmodel==0.0.39",
    "pydantic==2.13.4",
    "mutagen==1.48.1",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
]

[project.optional-dependencies]
asr = [
    "faster-whisper==1.2.1",
]

[dependency-groups]
build = [
    "pyinstaller",
]

[tool.uv]
package = false
